
<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GS Print | Digital Card</title>
<style>

body {
  margin: 0;
  min-height: 100vh;

  border-radius: 14px;
  background: #1d1d1d;
  color: white;
  text-decoration: none;
  font-size: 17px;
  font-weight: bold;

.link:active { background: #34302a; }
.gold {
  background: linear-gradient(120deg,#9b6b29,#e8c17b);
  color: #141414;
  border: none;

footer {
  margin-top: 40px;
  color: #777;
